<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Acompanhe seus processos de adocao iniciados no Patas Conscientes e veja o status de cada solicitacao." />

  <link rel="icon" href="/public/img/icons/favicon.svg">
  <link rel="stylesheet" href="/public/css/style.css">
  <link rel="stylesheet" href="/src/views/processosAdocao.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
  <title>Meus processos de ado&ccedil;&atilde;o - Patas Conscientes</title>
</head>

<body>
  <header id="headerIndex">
    <script type="module" src="/src/config/header.js"></script>
  </header>

  <section class="caminho"></section>

  <main class="processos-adocao-page" aria-labelledby="processosAdocaoTitulo">
    <section class="processos-adocao-hero">
      <h1 id="processosAdocaoTitulo" class="azul centro processosadocaotradutor">Meus processos de ado&ccedil;&atilde;o</h1>
      <p>
        Acompanhe aqui o status de suas solicita&ccedil;&otilde;es e os pr&oacute;ximos passos para encontrar seu
        novo melhor amigo.
      </p>
    </section>

    <div class="processos-adocao-layout">
      <aside class="processos-adocao-filtros" aria-labelledby="processosAdocaoFiltroTitulo">
        <h2 id="processosAdocaoFiltroTitulo">Filtrar por Status</h2>

        <form id="processosAdocaoFiltros" class="processos-adocao-filtro-lista">
          <label class="processos-adocao-filtro-opcao">
            <input type="checkbox" name="status" value="todos" checked>
            <span>Todos os processos</span>
          </label>

          <label class="processos-adocao-filtro-opcao">
            <input type="checkbox" name="status" value="analise">
            <span>Em an&aacute;lise</span>
          </label>

          <label class="processos-adocao-filtro-opcao">
            <input type="checkbox" name="status" value="entrevista">
            <span>Entrevista</span>
          </label>

          <label class="processos-adocao-filtro-opcao">
            <input type="checkbox" name="status" value="aprovado">
            <span>Aprovado</span>
          </label>
        </form>
      </aside>

      <section class="processos-adocao-conteudo" aria-live="polite">
        <p id="processosAdocaoResumoTexto" class="processos-adocao-resumo"></p>
        <div id="listaProcessosAdocao" class="processos-adocao-lista"></div>
      </section>
    </div>
  </main>

  <footer id="footer">
    <script src="/public/js/footer.js"></script>
  </footer>

  <script src="/public/js/traducao.js"></script>
  <script src="/public/js/processosAdocao.js" defer></script>
  <script src="/public/js/barraacessibilidade.js" defer></script>
  <script src="/public/js/tema.js" defer></script>
  <script src="/public/js/carregar_pagina.js"></script>
  <script type="module" src="/public/js/migalhasPao.js"></script>
</body>

</html>
